<mat-card class="login-card">
  <h2>Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" placeholder="Enter your email" />
      <mat-error *ngIf="f['email'].hasError('required')">Email is required.</mat-error>
      <mat-error *ngIf="f['email'].hasError('email')">Enter a valid email.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput formControlName="password" type="password" placeholder="Enter your password" />
      <mat-error *ngIf="f['password'].hasError('required')">Password is required.</mat-error>
      <mat-error *ngIf="f['password'].hasError('minlength')">Password must be at least 8 characters.</mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit">Login</button>

    <div class="register-link">
      <span>Don't have an account?</span>
      <button mat-button type="button" color="primary" (click)="goToRegister()">Register</button>
    </div>
  </form>
</mat-card>
